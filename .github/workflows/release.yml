name: Release

# Push a tag like v1.0.0 (matching package.json's version) to publish a GitHub
# Release with:
#   visitor-sign-in-<version>.apk      the Android app
#   visitor-sign-in-web-<version>.zip  the browser kiosk, to host anywhere over HTTPS
#   Code.gs                            the Google Sheets backend script
# The release notes come from CHANGELOG.md. With the KIOSK_KEYSTORE_* secrets
# (see android/README.md) the APK is release-signed, so it installs as an update.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME doesn't match package.json version $v"; exit 1; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: npm test
      - name: Build the Android app
        run: node scripts/build-android.mjs
        env:
          KIOSK_API_URL: ${{ secrets.KIOSK_API_URL }}
          KIOSK_KEY: ${{ secrets.KIOSK_KEY }}
          KIOSK_APP_ID: ${{ secrets.KIOSK_APP_ID }}
          KIOSK_KEYSTORE_BASE64: ${{ secrets.KIOSK_KEYSTORE_BASE64 }}
          KIOSK_KEYSTORE_PASSWORD: ${{ secrets.KIOSK_KEYSTORE_PASSWORD }}
          KIOSK_KEY_ALIAS: ${{ secrets.KIOSK_KEY_ALIAS }}
          KIOSK_KEY_PASSWORD: ${{ secrets.KIOSK_KEY_PASSWORD }}
      - name: Package the release files
        run: |
          mv dist/visitor-sign-in.apk "dist/visitor-sign-in-$VERSION.apk"
          cp -r web dist/web
          sed -i "s/^const BUILD = 'dev';/const BUILD = '$VERSION-${GITHUB_SHA::8}';/" dist/web/sw.js
          grep -q "const BUILD = '$VERSION-" dist/web/sw.js
          (cd dist/web && zip -qr "../visitor-sign-in-web-$VERSION.zip" .)
          cp apps-script/Code.gs dist/Code.gs
          node -e "const s=require('fs').readFileSync('CHANGELOG.md','utf8');const i=s.indexOf('## '+process.env.VERSION);const j=s.indexOf('\n## ',i+1);process.stdout.write(i<0?'See CHANGELOG.md':s.slice(s.indexOf('\n',i)+1,j<0?undefined:j).trim())" > dist/notes.md
          if [ -z "$KIOSK_KEYSTORE_BASE64" ]; then printf '\n\n> This APK is debug-signed. To install later versions as updates, add the release signing secrets (android/README.md).\n' >> dist/notes.md; fi
        env:
          KIOSK_KEYSTORE_BASE64: ${{ secrets.KIOSK_KEYSTORE_BASE64 }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/visitor-sign-in-$VERSION.apk" \
            "dist/visitor-sign-in-web-$VERSION.zip" \
            dist/Code.gs \
            --title "Visitor Sign-In $VERSION" --notes-file dist/notes.md
