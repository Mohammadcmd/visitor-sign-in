name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # what Raspberry Pi OS ships
      - name: Google backend
        run: node tests/apps-script.test.js
      - name: Raspberry Pi server
        working-directory: pi
        run: python3 -m unittest discover -s tests -v
