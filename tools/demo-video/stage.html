<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shock Tech Visitor Sign-In — product demo</title>
<style>
  :root {
    --blue: #0a5ea8; --blue-bright: #1a7fd0; --blue-deep: #063a6e; --navy: #031d38;
    --red: #b5121b; --orange: #f39220; --green: #6a9a3a; --ok: #2fbf6b;
    --ease: cubic-bezier(.16,1,.3,1); --ease-io: cubic-bezier(.65,0,.35,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); font-family: Inter, -apple-system, "Segoe UI", sans-serif; color: #fff; }
  .bg { position: absolute; inset: 0; background: radial-gradient(1400px 900px at 30% 40%, rgba(26,127,208,.35), transparent 60%), linear-gradient(150deg, #052c55, #020f20 75%); }
  .aurora { position: absolute; inset: -20%; filter: blur(90px); opacity: .5; }
  .aurora i { position: absolute; width: 900px; height: 900px; border-radius: 50%; }
  .aurora i:nth-child(1) { background: radial-gradient(closest-side, rgba(243,146,32,.45), transparent); left: 0; top: 55%; animation: d1 24s ease-in-out infinite alternate; }
  .aurora i:nth-child(2) { background: radial-gradient(closest-side, rgba(181,18,27,.4), transparent); left: 60%; top: 5%; animation: d2 28s ease-in-out infinite alternate; }
  .aurora i:nth-child(3) { background: radial-gradient(closest-side, rgba(106,154,58,.35), transparent); left: 65%; top: 65%; animation: d1 30s ease-in-out infinite alternate-reverse; }
  .aurora i:nth-child(4) { background: radial-gradient(closest-side, rgba(26,127,208,.6), transparent); left: 15%; top: 0; animation: d2 34s ease-in-out infinite alternate-reverse; }
  @keyframes d1 { to { transform: translate(500px, -300px) scale(1.2); } }
  @keyframes d2 { to { transform: translate(-450px, 350px) scale(.85); } }

  /* iPad */
  .ipad { position: absolute; left: 96px; top: 118px; width: 1166px; height: 844px; border-radius: 58px; background: linear-gradient(145deg, #2a2f36, #0c0e11); padding: 40px; box-shadow: 0 60px 120px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.08); transition: transform 1.1s var(--ease-io), opacity 1.1s var(--ease-io), filter 1.1s; }
  .ipad::before { content: ""; position: absolute; left: 50%; top: 18px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #1d2633; box-shadow: inset 0 0 0 2px #0a0d12; }
  .screen-wrap { width: 1086px; height: 764px; border-radius: 22px; overflow: hidden; background: #000; position: relative; }
  iframe { width: 1180px; height: 830px; border: 0; transform: scale(.92034); transform-origin: 0 0; display: block; }
  .ipad.away { transform: translateX(-160px) scale(.84) rotateY(14deg); opacity: .25; filter: blur(3px); }
  .ipad.hidden { transform: scale(.9); opacity: 0; }

  /* caption panel */
  .panel { position: absolute; left: 1330px; top: 150px; width: 520px; }
  .brand { display: inline-block; background: #fff; border-radius: 16px; padding: 12px 18px; box-shadow: 0 20px 40px rgba(0,0,0,.3); }
  .brand img { height: 56px; display: block; }
  .chapter { margin-top: 70px; font-size: 22px; font-weight: 800; letter-spacing: .18em; color: #8cc4f5; text-transform: uppercase; }
  .title { margin-top: 14px; font-size: 54px; line-height: 1.06; font-weight: 800; letter-spacing: -.02em; }
  .body { margin-top: 22px; font-size: 25px; line-height: 1.5; color: rgba(255,255,255,.78); }
  .sub { margin-top: 34px; display: inline-flex; align-items: center; gap: 14px; padding: 16px 22px; border-radius: 16px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); font-size: 23px; font-weight: 600; }
  .sub::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 6px rgba(243,146,32,.2); flex: none; }
  .sub:empty { display: none; }
  .in { animation: rise .9s var(--ease) both; }
  .in2 { animation: rise .9s .12s var(--ease) both; }
  .in3 { animation: rise .9s .24s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); filter: blur(8px); } }
  .note { position: absolute; left: 96px; top: 980px; font-size: 18px; color: rgba(255,255,255,.55); }

  /* chapter progress */
  .dots { position: absolute; left: 1330px; top: 960px; display: flex; gap: 10px; }
  .dots i { width: 42px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.18); transition: background .6s, width .6s; }
  .dots i.on { background: var(--orange); width: 70px; }
  .dots i.done { background: rgba(255,255,255,.55); }

  /* NFC reader */
  .reader { pointer-events: none; position: absolute; left: 1330px; top: 690px; width: 360px; height: 220px; opacity: 0; transform: translateY(40px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
  .reader.show { opacity: 1; transform: none; }
  .pad { position: absolute; left: 30px; bottom: 10px; width: 300px; height: 90px; border-radius: 22px; background: linear-gradient(180deg, #2b3e54, #142334); box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.12); transform: perspective(600px) rotateX(35deg); }
  .pad::after { content: "NFC READER"; position: absolute; left: 0; right: 0; bottom: -30px; text-align: center; font-size: 13px; letter-spacing: .25em; color: rgba(255,255,255,.45); font-weight: 800; }
  .glow { position: absolute; inset: 14px 70px; border-radius: 14px; background: radial-gradient(closest-side, rgba(110,200,255,.8), rgba(26,127,208,.1)); }
  .reader.ok .glow { background: radial-gradient(closest-side, rgba(120,255,170,.95), rgba(31,138,76,.2)); }
  .card { position: absolute; left: 140px; top: -40px; width: 84px; height: 118px; border-radius: 10px; background: #fff; box-shadow: 0 20px 40px rgba(0,0,0,.4); overflow: hidden; transform: translate(130px, -30px) rotate(16deg); opacity: 0; }
  .card::before { content: ""; display: block; height: 30px; background: linear-gradient(90deg, var(--blue), var(--blue-bright)); }
  .card b { display: block; margin-top: 18px; text-align: center; color: var(--blue); font-size: 22px; font-weight: 900; }
  .reader.tap .card { animation: tap 1.6s var(--ease-io) forwards; }
  @keyframes tap { 0% { opacity: 0; transform: translate(130px,-30px) rotate(16deg); } 20% { opacity: 1; } 55%, 75% { opacity: 1; transform: translate(0, 72px) rotate(0) scale(.92); } 100% { opacity: 0; transform: translate(-60px, -20px) rotate(-10deg); } }
  .waves { position: absolute; left: 180px; top: 150px; }
  .waves span { position: absolute; left: -40px; top: -40px; width: 80px; height: 80px; border-radius: 50%; border: 3px solid rgba(120,255,170,.9); opacity: 0; }
  .reader.ok .waves span { animation: burst .9s ease-out forwards; }
  .reader.ok .waves span:nth-child(2) { animation-delay: .12s; }
  .reader.ok .waves span:nth-child(3) { animation-delay: .24s; }
  @keyframes burst { from { transform: scale(.4); opacity: 1; } to { transform: scale(3.6); opacity: 0; } }

  /* title cards */
  .titlecard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(1200px 800px at 50% 45%, rgba(26,127,208,.5), transparent 65%), linear-gradient(160deg, #063a6e, #020f20 75%); opacity: 0; pointer-events: none; transition: opacity 1s var(--ease-io); z-index: 20; }
  .titlecard.show { opacity: 1; }
  .titlecard .logo { background: #fff; border-radius: 30px; padding: 30px 46px; box-shadow: 0 40px 90px rgba(0,0,0,.45); }
  .titlecard .logo img { width: 440px; display: block; }
  .titlecard h1 { margin: 56px 0 0; font-size: 92px; font-weight: 800; letter-spacing: -.03em; line-height: 1.02; }
  .titlecard h1 span { background: linear-gradient(90deg, #fff, #9fd0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .titlecard p { margin: 22px 0 0; font-size: 32px; color: rgba(255,255,255,.75); max-width: 1200px; line-height: 1.4; }
  .titlecard .kicker { font-size: 24px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: #ffb35c; margin: 0; }
  .titlecard ul { list-style: none; padding: 0; margin: 50px 0 0; display: grid; grid-template-columns: repeat(2, 520px); gap: 18px 30px; text-align: left; }
  .titlecard li { display: flex; gap: 18px; align-items: center; padding: 22px 26px; border-radius: 20px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); font-size: 26px; font-weight: 600; }
  .titlecard li b { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--orange); color: #fff; font-size: 24px; }
  .titlecard .cta { margin-top: 56px; padding: 22px 44px; border-radius: 999px; background: linear-gradient(180deg, var(--blue-bright), var(--blue)); font-size: 30px; font-weight: 800; box-shadow: 0 20px 50px rgba(10,94,168,.5); }

  /* spreadsheet view */
  .sheet { pointer-events: none; position: absolute; left: 150px; top: 170px; width: 1120px; height: 740px; border-radius: 20px; background: #fff; color: #1d2733; box-shadow: 0 60px 120px rgba(0,0,0,.55); overflow: hidden; opacity: 0; transform: translateY(60px) scale(.96); transition: opacity 1s var(--ease), transform 1s var(--ease); z-index: 5; font-family: Inter, Arial, sans-serif; }
  .sheet.show { opacity: 1; transform: none; }
  .sheet .top { height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 24px; background: #f4f7fa; border-bottom: 1px solid #dde3ea; font-size: 20px; font-weight: 700; }
  .sheet .top i { width: 30px; height: 36px; border-radius: 5px; background: #1f8a4c; position: relative; }
  .sheet .top i::after { content: ""; position: absolute; inset: 10px 7px; border: 2px solid #fff; border-radius: 2px; }
  .grid { overflow: hidden; height: 620px; }
  table { border-collapse: collapse; font-size: 15px; white-space: nowrap; }
  th, td { border: 1px solid #e3e8ee; padding: 9px 12px; text-align: left; }
  thead th { background: #f4f7fa; color: #5b6878; font-weight: 600; font-size: 13px; text-align: center; }
  tbody tr:first-child td { font-weight: 700; background: #eef5fc; }
  td.rn { background: #f4f7fa; color: #5b6878; text-align: center; width: 40px; }
  td.link { color: #0a5ea8; text-decoration: underline; }
  tr.new td { animation: hl 2.4s ease; }
  @keyframes hl { 0%, 40% { background: #fff3c4; } }
  .tabs { height: 56px; display: flex; gap: 6px; align-items: center; padding: 0 16px; background: #f4f7fa; border-top: 1px solid #dde3ea; font-size: 16px; }
  .tabs span { padding: 8px 18px; border-radius: 8px 8px 0 0; color: #5b6878; }
  .tabs span.on { background: #fff; color: #0a5ea8; font-weight: 700; box-shadow: inset 0 3px 0 #0a5ea8; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="aurora"><i></i><i></i><i></i><i></i></div>

  <div class="ipad" id="ipad"><div class="screen-wrap"><iframe id="kiosk" src="../../web/index.html" allow="camera; fullscreen"></iframe></div></div>

  <div class="sheet" id="sheet">
    <div class="top"><i></i>Shock Tech Visitor Log</div>
    <div class="grid" id="grid"></div>
    <div class="tabs"><span class="on">Visitors</span><span>Visits</span><span>Badges</span></div>
  </div>

  <div class="panel" id="panel">
    <div class="brand"><img src="../../web/assets/shocktech-logo.png" alt=""></div>
    <div class="chapter" id="chapter"></div>
    <div class="title" id="title"></div>
    <div class="body" id="body"></div>
    <div class="sub" id="sub"></div>
  </div>

  <div class="reader" id="reader"><div class="pad"><div class="glow"></div></div><div class="waves"><span></span><span></span><span></span></div><div class="card"><b id="cardno">V1</b></div></div>
  <div class="dots" id="dots"></div>
  <div class="note" id="note"></div>

  <div class="titlecard" id="tc"></div>

<script>
  const CHAPTERS = 7;
  document.getElementById('dots').innerHTML = '<i></i>'.repeat(CHAPTERS);
  const $ = (id) => document.getElementById(id);
  const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

  window.stage = {
    chapter(n, title, body) {
      $('chapter').textContent = `Part ${n} of ${CHAPTERS}`;
      $('title').textContent = title;
      $('body').textContent = body;
      $('sub').textContent = '';
      restart($('chapter'), 'in'); restart($('title'), 'in2'); restart($('body'), 'in3');
      [...$('dots').children].forEach((d, i) => { d.className = i + 1 < n ? 'done' : i + 1 === n ? 'on' : ''; });
    },
    sub(text) { $('sub').textContent = text; restart($('sub'), 'in'); },
    note(text) { $('note').textContent = text || ''; },
    reader(show) { $('reader').classList.toggle('show', show); },
    tap(badge) {
      const r = $('reader');
      $('cardno').textContent = badge;
      r.classList.remove('ok');
      restart(r, 'tap');
      setTimeout(() => restart(r, 'ok'), 850);
    },
    ipad(state) { $('ipad').className = 'ipad' + (state ? ' ' + state : ''); },
    card(html) { $('tc').innerHTML = html; $('tc').classList.add('show'); },
    hideCard() { $('tc').classList.remove('show'); },
    sheet(rows) {
      const cols = ['First Name', 'Last Name', 'Company', 'Who are you visiting?', 'Purpose', 'Citizenship status', 'Country', 'Quick entry', 'Registered', 'Photo folder'];
      const letters = 'ABCDEFGHIJ';
      const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
      $('grid').innerHTML = `<table><thead><tr><th></th>${cols.map((_, i) => `<th>${letters[i]}</th>`).join('')}</tr></thead><tbody>
        <tr><td class="rn">1</td>${cols.map((c) => `<td>${c}</td>`).join('')}</tr>
        ${rows.map((r, i) => `<tr class="${r.isNew ? 'new' : ''}"><td class="rn">${i + 2}</td>${r.cells.map((c, j) => `<td class="${j === 9 ? 'link' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}
        ${Array.from({ length: 14 }, (_, i) => `<tr><td class="rn">${rows.length + i + 2}</td>${cols.map(() => '<td></td>').join('')}</tr>`).join('')}
      </tbody></table>`;
      $('sheet').classList.add('show');
    },
    hideSheet() { $('sheet').classList.remove('show'); },
  };
</script>
</body>
</html>
